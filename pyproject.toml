[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "goldprice-dev"
version = "0.1.0"
description = "Typed clients for the goldprice.dev API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nusantara Ventures, LLC", email = "hello@goldprice.dev" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<1"]
keywords = ["api", "sdk", "gold", "silver", "precious-metals", "commodities", "decimal"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://goldprice.dev/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/goldprice_dev"]

[tool.hatch.build.targets.sdist]
include = ["src/goldprice_dev", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.hooks.custom]
